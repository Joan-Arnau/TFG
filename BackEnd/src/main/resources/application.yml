spring:
  application:
    name: promo-rural-api
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
  datasource:
    'url': ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/promorural}
    'username': ${SPRING_DATASOURCE_USERNAME:promorural}
    'password': ${SPRING_DATASOURCE_PASSWORD:promorural}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format-sql: true
        jdbc:
          'time-zone': CET
  flyway:
    enabled: true
    baseline-on-migrate: true
  jackson:
    'time-zone': CET

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

'app':
  default-language: ${DEFAULT_MUNICIPALITY_LANGUAGE:ca}
  supported-languages: ${SUPPORTED_LANGUAGES:ca,es,en}
  backoffice-base-url: ${BACKOFFICE_BASE_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:no-reply@promorural.local}
  jwt:
    secret: ${JWT_SECRET:change-this-secret-key-with-at-least-32-characters}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  file-upload:
    upload-dir: ${FILE_UPLOAD_DIR:uploads}
    base-url: ${FILE_BASE_URL:/uploads}

logging:
  level:
    '[org.springframework.security]': DEBUG
    '[com.promorural.api]': DEBUG
