services:
  db-server:
    image: postgis/postgis:16-3.4
    container_name: promo-rural-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: promo-rural-api
    restart: unless-stopped
    depends_on:
      db-server:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    environment:
      DEFAULT_MUNICIPALITY_LANGUAGE: ${DEFAULT_MUNICIPALITY_LANGUAGE}
      SUPPORTED_LANGUAGES: ${SUPPORTED_LANGUAGES}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-server:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_MERCHANT_USERNAME: ${SEED_MERCHANT_USERNAME}
      SEED_MERCHANT_PASSWORD: ${SEED_MERCHANT_PASSWORD}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-localhost}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-1025}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_SMTP_AUTH: ${SPRING_MAIL_SMTP_AUTH:-false}
      SPRING_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:-false}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    container_name: promo-rural-nginx
    restart: unless-stopped
    depends_on:
      api-server:
        condition: service_healthy
    ports:
      - "80:80"
    environment:
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro

volumes:
  db_data:
  uploads_data:
