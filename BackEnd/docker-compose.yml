services:
  db-server:
    image: postgis/postgis:16-3.4
    container_name: promo-rural-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx-proxy:
    image: nginx:1.27-alpine
    container_name: promo-rural-nginx-dev
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-*}
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/templates/default.conf.template:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  api-server:
    build: .
    container_name: promo-rural-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-server:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_MAIL_HOST: mail-server
      SPRING_MAIL_PORT: 1025
    depends_on:
      db-server:
        condition: service_healthy
      mail-server:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mail-server:
    image: axllent/mailpit:latest
    container_name: promo-rural-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  db_data:
